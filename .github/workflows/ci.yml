name: regression

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  cycle-accurate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          iverilog -V | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Checkout RTL under test
        run: git clone --depth 1 https://github.com/lowfreq-quant/image-processing rtl

      - name: Run 13-flow regression
        env:
          RTL_ROOT: ${{ github.workspace }}/rtl
          IVERILOG_BIN: /usr/bin
        run: python run_all.py
